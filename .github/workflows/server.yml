name: Compiler l'application Free tune server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'srvcore/**'
      - 'windows/renderer-srv/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK serveur
        shell: bash
        run: |
          set +e
          gradle :server:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E '^e: ' build.log | head -20 | while read -r l; do echo "::error::$l"; done
          grep -A8 'What went wrong' build.log | head -14 | while read -r l; do echo "::error::$l"; done
          exit $code

      - name: Préparer le fichier
        run: cp server/build/outputs/apk/debug/server-debug.apk freetune-server.apk

      - name: Signer avec la clé privée Free tune
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
          REQUIRE_SIGN: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: tools/resign.sh freetune-server.apk

      - name: Publier l'APK serveur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-${{ github.run_number }}
          name: Free tune server ${{ github.run_number }}
          files: freetune-server.apk
          make_latest: false
