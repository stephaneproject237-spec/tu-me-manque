name: Compiler Free tune Windows

on:
  push:
    branches: [main, brouillon-gros]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Numéro de version
        shell: bash
        run: npm version "1.${{ github.run_number }}.0" --no-git-tag-version

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Tester le moteur (faux serveur, faux yt-dlp)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "test du moteur ignoré sous Windows (script shell de test)"; else npm test; fi

      - name: Construire l'application
        run: npx electron-builder --win portable --x64 --publish never

      - name: Vérifier le fichier
        shell: bash
        run: ls -la dist && test -f dist/FreeTune-Windows.exe

      - name: Publier
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-${{ github.run_number }}
          name: Free tune Windows ${{ github.run_number }}
          files: windows/dist/FreeTune-Windows.exe
          make_latest: false
