name: Compiler Take my voice

on:
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - '.github/workflows/voice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK Take my voice
        shell: bash
        run: |
          set +e
          gradle :voice:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E '^e: |error:' build.log | head -20 | while read -r l; do echo "::error::$l"; done
          exit $code

      - name: Préparer le fichier
        run: cp voice/build/outputs/apk/debug/voice-debug.apk take-my-voice.apk

      - name: Signer avec la clé privée Free tune
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
          REQUIRE_SIGN: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: tools/resign.sh take-my-voice.apk

      - name: Publier l'APK (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-${{ github.run_number }}
          name: Take my voice ${{ github.run_number }}
          files: take-my-voice.apk
          make_latest: false
