name: Compiler Casque

on:
  push:
    branches: [main]
    paths-ignore:
      - 'voice/**'
      - 'tools/voice-android.json'
      - '.github/workflows/voice.yml'
      - 'web/**'
      - 'app/src/tmm/**'
      - 'supabase/**'
      - 'README.md'
      - 'tools/casque-android.json'
      - 'tools/build-casque-web.py'
      - 'windows/**'
      - 'server/**'
      - 'server2/**'
      - '.github/workflows/server.yml'
      - '.github/workflows/windows.yml'
      - '.github/workflows/mac.yml'
  workflow_dispatch:
    inputs:
      split:
        description: 'APK séparés 32 bits / 64 bits'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration Firebase
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::Le fichier app/google-services.json est manquant. Ajoute-le au dépôt."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        env:
          APK_URL: https://github.com/${{ github.repository }}/releases/download/casque-${{ github.run_number }}/Free-tune.apk
        shell: bash
        run: |
          set +e
          gradle :app:assembleCasqueDebug ${{ inputs.split && '-PabiSplit=true' || '' }} --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E '^e: ' build.log | head -20 | while read -r l; do echo "::error::$l"; done
          grep -A6 -E 'What went wrong' build.log | head -14 | while read -r l; do echo "::error::$l"; done
          exit $code

      - name: Préparer le fichier
        run: |
          d=app/build/outputs/apk/casque/debug
          if [ -f $d/app-casque-debug.apk ]; then cp $d/app-casque-debug.apk Free-tune.apk; fi
          if [ -f $d/app-casque-arm64-v8a-debug.apk ]; then cp $d/app-casque-arm64-v8a-debug.apk Free-tune-64bits.apk; cp $d/app-casque-armeabi-v7a-debug.apk Free-tune-32bits.apk; fi

      - name: Signer avec la clé privée Free tune
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
          REQUIRE_SIGN: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: tools/resign.sh Free-tune*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: casque
          path: Free-tune*.apk
          if-no-files-found: error

      - name: Publier l'APK (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: casque-${{ github.run_number }}
          name: Casque ${{ github.run_number }}
          files: Free-tune*.apk
          make_latest: false

      # Annonce automatique : sans ça, l'appli ne propose la mise à jour que si quelqu'un pense à mettre à jour
      # tools/casque-android.json à la main après chaque compilation (oubli déjà arrivé plusieurs fois).
      - name: Annoncer automatiquement cette version (mise à jour proposée dans l'appli)
        if: github.ref == 'refs/heads/main'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # main a pu avancer pendant la compilation : on repart de la dernière version et on réessaie si besoin.
          for essai in 1 2 3 4 5; do
            git fetch -q --depth=1 origin main
            git reset -q --hard FETCH_HEAD
            python3 - <<'PY'
          import json, os
          run = os.environ["RUN_NUMBER"]
          ann = {
            "versionCode": int(run), "versionName": "1." + run, "notes": "Mise à jour importante",
            "apk": "https://github.com/" + os.environ["REPO"] + "/releases/download/casque-" + run + "/Free-tune.apk",
          }
          with open("tools/casque-android.json", "w", encoding="utf-8") as f:
              json.dump(ann, f, ensure_ascii=False, indent=1); f.write("\n")
          with open("web/casque/update.json", encoding="utf-8") as f:
              upd = json.load(f)
          upd.update(ann)
          with open("web/casque/update.json", "w", encoding="utf-8") as f:
              json.dump(upd, f, ensure_ascii=False, indent=1); f.write("\n")
          PY
            git add tools/casque-android.json web/casque/update.json
            git diff --cached --quiet && break
            git commit -q -m "Annonce Free tune ${{ github.run_number }} (automatique)"
            git push origin HEAD:main && break
            if [ "$essai" = 5 ]; then echo "::error::Annonce impossible : main refuse la publication."; exit 1; fi
            sleep $((essai * 5))
          done
          git push origin HEAD:brouillon-gros || echo "::warning::brouillon-gros non mise à jour."
          # Un push fait avec le jeton du workflow ne déclenche pas web.yml : sans cet appel,
          # github.io garde l'ancien update.json et l'appli ne voit pas la nouvelle version.
          gh workflow run web.yml --ref main -R "$REPO"
