name: Publier le site iPhone

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: read
  deployments: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Débloquer un déploiement resté en attente
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shas="9562685a600384437ddb9a741f4fc02e3355281b $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=15" -q '.[].sha' 2>/dev/null)"
          for sha in $shas; do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "annulé : $sha" || true
          done
          sleep 5
      - name: Débloquer un déploiement resté en attente
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shas="9562685a600384437ddb9a741f4fc02e3355281b $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=15" -q '.[].sha' 2>/dev/null)"
          for sha in $shas; do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "annulé : $sha" || true
          done
          sleep 5
      - id: deployment
        uses: actions/deploy-pages@v4
