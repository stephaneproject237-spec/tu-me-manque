name: Publier le site iPhone

# Le site (Tu me manques + Free tune pour iPhone) est copié sur la branche gh-pages.
# Dans GitHub : Settings › Pages › Source « Deploy from a branch », branche gh-pages, dossier / (root).
# (L'ancienne méthode « deploy-pages » restait bloquée en attente : « Timeout reached ».)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copier web/ sur la branche gh-pages
        run: |
          cd web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site publié depuis ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Publié : https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
