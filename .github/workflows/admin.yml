name: Compiler l'application Admin

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'web/admin/**'
      - 'web/config.js'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK Admin
        shell: bash
        run: |
          set +e
          gradle :admin:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E '^e: ' build.log | head -20 | while read -r l; do echo "::error::$l"; done
          exit $code

      - name: Préparer le fichier
        run: cp admin/build/outputs/apk/debug/admin-debug.apk tu-me-manque-admin.apk

      - name: Publier l'APK Admin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-${{ github.run_number }}
          name: Admin ${{ github.run_number }}
          files: tu-me-manque-admin.apk
          make_latest: false
