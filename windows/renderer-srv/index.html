<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; connect-src https://itunes.apple.com https://*.supabase.co; media-src ftmedia: https:; script-src 'self'">
<title>Free tune</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><div class="lg">🎧</div><div><b>Free tune</b><small><span id="plat">Windows</span> <span id="ver"></span></small></div></div>
    <nav id="nav">
      <button data-t="search" class="on">🔎 Recherche</button>
      <button data-t="dl">⬇️ Téléchargements <i id="ndl"></i></button>
      <button data-t="me">👤 Mon compte</button>
      <button data-t="set">⚙️ Réglages</button>
      <button data-t="acc" id="nav-srv" hidden>🖥️ Gestion des serveurs <i id="nacc"></i></button>
    </nav>
    <button class="lockb" id="lock-btn" title="Gestion des serveurs (mot de passe)">🔒 Gestion des serveurs</button>
    <div id="side-state" class="side-state"></div>
  </aside>
  <main>
    <div id="upd" class="banner" hidden></div>
    <section id="t-search"></section>
    <section id="t-acc" hidden></section>
    <section id="t-dl" hidden></section>
    <section id="t-me" hidden></section>
    <section id="t-set" hidden></section>
  </main>
</div>
<div id="player" hidden>
  <div id="pv-wrap" hidden><video id="pv" playsinline></video><div class="pv-ctl"><button id="pv-fs" class="ib" title="Plein écran">⛶</button><button id="pv-min" class="ib" title="Masquer l'image (le son continue)">▾</button></div></div>
  <div class="pbar">
    <div class="pinfo"><b id="p-title"></b><span id="p-sub" class="small sub"></span></div>
    <button id="p-prev" class="ib" title="Précédent">⏮</button>
    <button id="p-play" class="ib big" title="Lecture / pause">▶</button>
    <button id="p-next" class="ib" title="Suivant">⏭</button>
    <span id="p-cur" class="small">0:00</span><input type="range" id="p-seek" min="0" max="1000" value="0"><span id="p-dur" class="small">0:00</span>
    <button id="p-mute" class="ib" title="Son">🔊</button><input type="range" id="p-vol" min="0" max="100" value="100">
    <button id="p-vid" class="ib" title="Afficher l'image" hidden>📺</button>
    <button id="p-dl" class="btn sm out" title="Télécharger ce titre" hidden>⬇</button>
    <button id="p-x" class="ib" title="Fermer le lecteur">✕</button>
  </div>
</div>
<div id="gate" hidden></div>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="shim.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
